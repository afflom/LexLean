[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/afflom/lexlean"
homepage = "https://github.com/afflom/lexlean"
authors = ["Alex Flom"]
keywords = ["lean", "latex", "formal-methods", "compiler", "proof"]
categories = ["compilers", "development-tools"]

[workspace.dependencies]
# A `path` dependency with no `version` is a wildcard requirement, and
# `cargo deny` refuses those (`wildcards = "deny"`). Every internal dependency
# carries both.
repo-model = { version = "0.1.1", path = "crates/model" }
repo-conformance = { version = "0.1.1", path = "crates/conformance" }
lexlean = { version = "0.1.1", path = "crates/lexlean" }

camino = "1.2"
clap = { version = "4.5", features = ["derive"] }
fs4 = { version = "0.13", features = ["sync"] }
proptest = "1.6"
same-file = "1.0"
semver = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
toml = "0.8"
unicode-normalization = "0.1"
walkdir = "2"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
