# R1, R2, R3: the model gate, the specification-link gate, and the honesty
# meta-gate (SPEC.md §9.4), run separately from the code gate so that a red
# mark here reads as what it is: not broken code, but a claim that has
# drifted from its evidence.
#
# This job needs no Lean toolchain: `validate-model` and `validate-spec-links`
# read the model, the suites, and the sources; the meta-gate test binary
# (`crates/conformance/tests/bdd.rs`) checks register/scenario/test bijection,
# the Gherkin subset, and its own falsifiability. The Lean-backed conformance
# cases belong to `just bdd` inside `just vv` in ci.yml, where the pinned
# toolchain is installed.
name: honesty

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: honesty-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  honesty:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: just
      # The model is the single source; the §31 table and the register are
      # bijective; every registered ID has one scenario and one named test.
      - run: just model spec-links
      - run: cargo test --locked -p repo-conformance --test bdd
