# R1, R2, R3: the model gate, the specification-link gate, and the honesty
# meta-gate (SPEC.md §9.4).
#
# Split from `ci` so that a red mark here reads as what it is: not broken code,
# but a claim that has drifted from its evidence.
name: honesty

on:
  push: { branches: [main] }
  pull_request:

jobs:
  honesty:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      # The model is the single source; the §31 table and the register are
      # bijective; every registered ID has one scenario and one named test.
      - run: just model spec-links bdd
