# R10, AR-13: two clean builds in distinct absolute directories are
# byte-identical for every platform-independent artifact (SPEC.md §9.4, §28.4).
# No build cache: the gate runs from a clean checkout.
name: reproducibility

on:
  push: { branches: [main] }
  pull_request:

jobs:
  repro:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # The gate copies each example project into two distinct absolute
      # directories, runs a clean `build` in each, and compares the entire
      # platform-independent artifact set byte-for-byte after the required
      # path normalization.
      - run: just repro
