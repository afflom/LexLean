# The normative acceptance gate (SPEC.md §9.4) and the supported-host gate
# (§8.3).
#
# `just vv` is the single gate, run from a clean checkout on Linux x86-64 with
# the exact pinned toolchains and no build cache: §9.4 says "from a clean
# checkout", and a restored target directory is not one. `honesty` is split
# out so a claim that has drifted from its evidence reads differently from
# broken code.
#
# Every version this file needs is read from the file that pins it —
# `rust-toolchain.toml` through `rustup toolchain install`, `lean-toolchain`
# through `elan toolchain install` — so the workflow cannot drift from the
# repository's own pins. Third-party actions are pinned by commit, with the
# release they belong to named alongside: a floating tag is a dependency
# whose contents may change after review, which R6 does not allow for the
# code in the crate and should not allow for the code that gates it.
name: ci

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

# Read-only: nothing in this workflow writes to the repository, publishes a
# package, or mints an artifact. `release.yml` asks for what it needs there.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # A clean job still compiles several test profiles before Atlas. Disabling
  # Cargo's per-crate incremental cache leaves runner disk for proof evidence
  # and for the bounded swap file used by Lean's largest environments.
  CARGO_INCREMENTAL: "0"

jobs:
  vv:
    name: just vv
    runs-on: ubuntu-24.04
    # Native Atlas elaboration, per-module kernel replay, and per-module axiom
    # audit are intentionally the long pole. GitHub-hosted jobs permit six
    # hours; a shorter local-style timeout would turn complete proof coverage
    # into a CI failure mode.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: just,cargo-deny
      - name: Install elan and the pinned Lean toolchain
        run: |
          set -euo pipefail
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      - name: Reserve bounded overflow memory for native Atlas
        run: |
          set -euo pipefail
          sudo fallocate -l 6G "$RUNNER_TEMP/lexlean-atlas.swap"
          sudo chmod 600 "$RUNNER_TEMP/lexlean-atlas.swap"
          sudo mkswap "$RUNNER_TEMP/lexlean-atlas.swap"
          sudo swapon "$RUNNER_TEMP/lexlean-atlas.swap"
          swapon --show
      - run: just vv

  # Atlas is LexLean's foundation model, not an incidental example hidden in
  # the aggregate gate. This job runs the same discovered-example verifier in
  # write mode so CI can publish the normalized evidence even when a migration
  # legitimately changes it; the final diff check keeps the job red until that
  # evidence has been reviewed and committed.
  native-atlas:
    name: native Atlas (66-module proof evidence)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Install elan and the pinned Lean toolchain
        run: |
          set -euo pipefail
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      - name: Reserve bounded overflow memory for native Atlas
        run: |
          set -euo pipefail
          sudo fallocate -l 8G "$RUNNER_TEMP/lexlean-atlas.swap"
          sudo chmod 600 "$RUNNER_TEMP/lexlean-atlas.swap"
          sudo mkswap "$RUNNER_TEMP/lexlean-atlas.swap"
          sudo swapon "$RUNNER_TEMP/lexlean-atlas.swap"
          swapon --show
      - id: atlas
        name: Audit and verify the complete native Atlas graph
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          {
            echo "repository ${GITHUB_REPOSITORY}"
            echo "commit ${GITHUB_SHA}"
            echo "run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "host $(uname -srm)"
            echo "rustc $(rustc --version)"
            echo "lean $(lean --version)"
            echo
          } > ci-evidence/native-atlas.txt
          cargo xtask validate-model 2>&1 | tee -a ci-evidence/native-atlas.txt
          cargo xtask verify-examples --write 2>&1 | tee -a ci-evidence/native-atlas.txt
      - name: Assert complete modular Atlas evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="examples/uor-atlas/expected/verify"
          test "$(find "$evidence/process/lean" -maxdepth 1 -type f -name '*.json' | wc -l)" -eq 66
          test "$(find "$evidence/process/leanchecker" -maxdepth 1 -type f -name '*.json' | wc -l)" -eq 66
          test "$(find "$evidence/audit" -maxdepth 1 -type f -name '*.lean' | wc -l)" -eq 66
          test "$(find "$evidence/audit" -maxdepth 1 -type f -name '*.process.json' | wc -l)" -eq 66
          test "$(wc -l < "$evidence/audit/output.txt")" -eq 5577
          test -f "$evidence/process/lean/LexLeanExample.Atlas.json"
          test -f "$evidence/process/leanchecker/LexLeanExample.Atlas.json"
          test ! -e "$evidence/process/lean/LexLeanExample.Labels.json"
          test ! -e "$evidence/process/lean/LexLeanExample.Main.json"
          echo "native Atlas: 66 elaborations, 66 kernel replays, 66 axiom-audit members, 5577 audited declarations"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: native-atlas-log
          path: ci-evidence/native-atlas.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-atlas-normalized-evidence
          path: examples/uor-atlas/expected/verify
          if-no-files-found: error
          retention-days: 14
      - name: Normalized Atlas evidence is committed
        run: git diff --exit-code -- examples/uor-atlas/expected/verify

  # §8.3: the crate builds and its non-Lean tests pass on every supported
  # host. This job installs no Lean toolchain on purpose — that is the
  # property under test. A case whose assertions need the pinned toolchain
  # goes through `repo_conformance::support::lean_backed`, which on a
  # non-normative host runs the case's platform-independent assertions and
  # reports which ones it skipped; on Linux x86-64 the same gate makes the
  # toolchain mandatory, so nothing passes vacuously where it matters.
  host-matrix:
    name: build and non-Lean tests (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: windows-2022, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      # The image label and the host triple are separate facts. A runner
      # image that changed architecture underneath the label would otherwise
      # leave one of the five §8.3 hosts silently untested.
      - name: The runner is the host this leg claims
        shell: bash
        run: |
          set -euo pipefail
          host="$(rustc -vV | sed -n 's/^host: //p')"
          if [ "$host" != "${{ matrix.target }}" ]; then
            echo "::error::${{ matrix.os }} is $host, not ${{ matrix.target }} (SPEC.md §8.3)"
            exit 1
          fi
          echo "$host"
      - run: cargo build --locked --workspace --all-features
      - run: cargo test --locked --workspace --all-features
