# language/renderer-tokens.toml --- the single source for trusted LaTeX
# controls and mathematical glyphs (SPEC.md §13.10). Rows sort by id.
# `audit-language-closure` requires this registry to equal the minimal
# transitive closure of tokens referenced by the exact preamble, the
# backend constructs listed in language/bootstrap.toml, core LRE, and
# shipped standard-package LRE.

